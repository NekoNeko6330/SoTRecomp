# Look Tracking: Link's head and eyes follow what's around him (from ModOcarina, 13053ec and b793191).

[manifest]
id = "sot_look_tracking"
version = "1.0.0"
display_name = "Look Tracking"
description = """
Link's head and eye tracking, from ModOcarina (ENABLE_LINK_LOOK_TRACKING):
- Head: Link turns his head toward the closest interesting actor (the one he's locked on to first, then a boss, an \
enemy, an NPC, a prop or a door), and tilts it into turns when there's nothing to look at
- Eyes: his face is re-UV'd like ModOcarina's, each eye drawn from its own texture, and his pupils follow the same \
actor (and the animations' eye directions)"""
short_description = "Link's head and eyes follow what's around him."
authors = [ "Claude" ]
game_id = "sot"
minimum_recomp_version = "0.5.0"
dependencies = []
optional_dependencies = []
native_libraries = []

[inputs]
elf_path = "build/mod.elf"
mod_filename = "sot_look_tracking"
func_reference_syms_file = "../../sot.syms.toml"
data_reference_syms_files = [ "../../sot.datasyms.toml" ]
additional_files = []
