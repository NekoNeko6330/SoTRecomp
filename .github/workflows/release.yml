name: release

# Builds Sands of Time: Recompiled for Linux and Windows and publishes a GitHub release.
#
# The recompiled code is generated from the ROM, which is never stored in this repository:
# set the repository secret SOT_ROM_URL to a download link of "OoT SoT 1.22" (a Mega link, or a direct
# link; the .z64 can be inside a .7z or .zip archive). The ROM is only passed between jobs encrypted
# with that secret, and deleted at the end.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

env:
  SOT_ROM_MD5: 33273fb052fa8ea94410352a6ce52f8f

jobs:
  fetch-rom:
    runs-on: ubuntu-22.04
    steps:
      - name: Download the ROM
        env:
          SOT_ROM_URL: ${{ secrets.SOT_ROM_URL }}
        run: |
          if [ -z "$SOT_ROM_URL" ]; then
            echo "::error::Set the SOT_ROM_URL repository secret to a download link of the Sands of Time 1.22 ROM"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y megatools p7zip-full
          mkdir download && cd download
          if [[ "$SOT_ROM_URL" == *mega.nz* ]]; then
            megadl --no-progress "$SOT_ROM_URL"
          else
            curl -fL -o rom.download "$SOT_ROM_URL"
          fi
          for f in *; do
            case "$f" in
              *.7z|*.zip|*.download) 7z x -y "$f" > /dev/null || true ;;
            esac
          done
          rom=$(find . -type f \( -iname '*.z64' -o -iname '*.download' \) -exec md5sum {} + | awk -v m="$SOT_ROM_MD5" '$1 == m { print substr($0, 35); exit }')
          if [ -z "$rom" ]; then
            echo "::error::No file with md5 $SOT_ROM_MD5 (Sands of Time 1.22, .z64) found in the download"
            find . -type f -exec md5sum {} +
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SOT_ROM_URL -in "$rom" -out ../rom.enc
      - name: Pass the encrypted ROM to the build jobs
        uses: actions/upload-artifact@v4
        with:
          name: rom-encrypted
          path: rom.enc
          retention-days: 1

  patches:
    # The patches are MIPS code built with clang; the Windows runner's LLVM has no MIPS target, so build them here.
    # Their outputs only come from patches/*.c and the game's symbol names.
    needs: fetch-rom
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lld llvm clang
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install spimdisasm rabbitizer crunch64 xxhash
      - uses: actions/download-artifact@v4
        with:
          name: rom-encrypted
      - name: Decrypt the ROM
        env:
          SOT_ROM_URL: ${{ secrets.SOT_ROM_URL }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SOT_ROM_URL -in rom.enc -out sot.z64 && rm rom.enc
      - name: Generate and build the patches
        run: python tools/generate.py sot.z64
      - name: Build the mods
        run: |
          cmake --build lib/N64ModernRuntime/N64Recomp/build --target RecompModTool --parallel
          make -C mods
          cd mods/out && zip -X ../../SoTRecompiled-Mods.zip *.nrm
      - uses: actions/upload-artifact@v4
        with:
          name: SoTRecompiled-Mods
          path: SoTRecompiled-Mods.zip
      - uses: actions/upload-artifact@v4
        with:
          name: patches-prebuilt
          retention-days: 1
          path: |
            patches/patches.elf
            patches/patches.bin
            RecompiledPatches/

  build-linux:
    needs: fetch-rom
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev lld llvm clang clang-15
          # SDL2 from source, like Zelda64Recomp
          wget -q https://www.libsdl.org/release/SDL2-2.26.1.tar.gz
          tar -xzf SDL2-2.26.1.tar.gz
          cd SDL2-2.26.1
          ./configure > /dev/null
          make -j$(nproc) > /dev/null
          sudo make install > /dev/null
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install spimdisasm rabbitizer crunch64 xxhash
      - uses: actions/download-artifact@v4
        with:
          name: rom-encrypted
      - name: Decrypt the ROM
        env:
          SOT_ROM_URL: ${{ secrets.SOT_ROM_URL }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SOT_ROM_URL -in rom.enc -out sot.z64 && rm rom.enc
      - name: Generate the recompiled code
        run: python tools/generate.py sot.z64
      - name: Build
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15 -DSOT_VERSION="${TAG#v}"
          cmake --build build --target Zelda64Recompiled -j$(nproc)
      - name: Package
        run: |
          mkdir -p SoTRecompiled
          cp build/Zelda64Recompiled SoTRecompiled/SoTRecompiled
          cp -r assets SoTRecompiled/
          rm -rf SoTRecompiled/assets/scss
          cp README.md COPYING recompcontrollerdb.txt SoTRecompiled/
          tar -czf SoTRecompiled-Linux.tar.gz SoTRecompiled
      - uses: actions/upload-artifact@v4
        with:
          name: SoTRecompiled-Linux
          path: SoTRecompiled-Linux.tar.gz

  build-windows:
    needs: [fetch-rom, patches]
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        shell: pwsh
        run: choco install ninja make -y --no-progress
      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install spimdisasm rabbitizer crunch64 xxhash
      - uses: actions/download-artifact@v4
        with:
          name: rom-encrypted
      - name: Decrypt the ROM
        env:
          SOT_ROM_URL: ${{ secrets.SOT_ROM_URL }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SOT_ROM_URL -in rom.enc -out sot.z64 && rm rom.enc
      - name: Generate the recompiled code
        env:
          SOT_SKIP_PATCHES: 1
        run: python tools/generate.py sot.z64
      - name: Get the patches built on Linux
        uses: actions/download-artifact@v4
        with:
          name: patches-prebuilt
      - name: Build
        env:
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          # Use Visual Studio's clang-cl: fmt 10.2 (used by N64ModernRuntime) doesn't build with clang 20
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $env:PATH = "$vs\VC\Tools\Llvm\x64\bin;$env:PATH"
          clang-cl --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_CXX_FLAGS="-Xclang -fexceptions -Xclang -fcxx-exceptions" -DSOT_BUILD_PATCHES=OFF -DSOT_VERSION="$($env:TAG -replace '^v','')"
          cmake --build build --target Zelda64Recompiled -j 4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path SoTRecompiled | Out-Null
          Copy-Item build/Zelda64Recompiled.exe SoTRecompiled/SoTRecompiled.exe
          Copy-Item build/*.dll SoTRecompiled/
          # Symbols, for the function names in crash logs (the name the executable refers to)
          Copy-Item build/Zelda64Recompiled.pdb SoTRecompiled/Zelda64Recompiled.pdb
          Copy-Item -Recurse assets SoTRecompiled/assets
          Remove-Item -Recurse -Force SoTRecompiled/assets/scss
          Copy-Item README.md, COPYING, recompcontrollerdb.txt SoTRecompiled/
          Compress-Archive -Path SoTRecompiled -DestinationPath SoTRecompiled-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SoTRecompiled-Windows
          path: SoTRecompiled-Windows.zip

  release:
    needs: [patches, build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SoTRecompiled-*
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Sands of Time Recompiled ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            SoTRecompiled-Linux.tar.gz
            SoTRecompiled-Windows.zip
            SoTRecompiled-Mods.zip
          body: |
            Native PC port of The Legend of Zelda: Ocarina of Time – **Sands of Time** (1.22), made with N64: Recompiled.

            **You need your own copy of the Sands of Time 1.22 ROM** (`OoT SoT 1.22.z64`, md5 `33273fb052fa8ea94410352a6ce52f8f`, big-endian .z64).
            Extract the archive, run `SoTRecompiled` (Linux) or `SoTRecompiled.exe` (Windows), select the ROM in the launcher, then start the game.
            You can also run `SoTRecompiled --rom "OoT SoT 1.22.z64" --start`.
            Settings and saves are stored in `SoTRecompiled` (`%LOCALAPPDATA%` on Windows, `~/.config` on Linux).

            Requirements: a GPU with Vulkan 1.2 or Direct3D 12, a CPU with AVX. On Linux, SDL2 must be installed.

            **New in this version**
            - Fixed a crash when some actors are removed (a function the recompiler had missed)
            - Launcher: The Legend of Zelda: Sands of Time, with this project's version
            - The version is now this project's (0.5.0): mods made for the previous version have to be updated

            **Mods** (`SoTRecompiled-Mods.zip`): put the `.nrm` files in the `mods` folder (Mods in the launcher has a
            button to open it), replacing the ones from the previous version
            - Better Roll: controlled and faster rolling (thinedave's ocarina-things)
            - Look Tracking: Link's head and eyes follow what's around him (ModOcarina)
            - Wisdom Fairy 1.0 Text: the Great Fairy of Wisdom's line about Big Brother, as it was in 1.0
            - Torch Texture Test: replaces the torches' flame guard texture (texture pack in an .nrm)
            To make mods, see `mods/README.md` in the repository.

            Built on the current Zelda64Recomp runtime (N64ModernRuntime and RT64). The game runs at its full speed
            (20 fps, interpolated to your display's refresh rate). This is still an early build: expect crashes, and
            please send the crash logs.

            If it runs slowly, check that the game uses your dedicated GPU, and try lower settings in the
            Graphics menu (resolution, MSAA). Run with the environment variable `SOTRECOMP_FPS=1` to print
            the framerate and rendering times to the console.

  cleanup:
    needs: release
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Delete the intermediate artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            rom-encrypted
            patches-prebuilt
