# Config file for the Sands of Time recompilation.
# sot.syms.toml and sot_decompressed.z64 are generated from the ROM by tools/gen_sot_syms.py.

[input]
entrypoint = 0x80000400
# Paths are relative to the location of this config file.
symbols_file_path = "sot.syms.toml"
rom_file_path = "sot_decompressed.z64"
output_func_path = "RecompiledFuncs"
recomp_include = "#include \"recomp.h\""

[patches]
stubs = [
    # Stub out unused functions that directly manipulate RCP status.
    "RcpUtils_PrintRegisterStatus",
    "RcpUtils_Reset",
    "osDriveRomInit",
]

ignored = [
    # Corrupted functions in pfschecker.c
    "func_80105788",
    "func_80105A60",
    # Unnamed part of libultra's exception handler (exceptasm, replaced by the runtime)
    "func_80003F2C",
]

# Function definition for the overlay loading function.
[[patches.func]]
name = "load_overlays"
args = ["u32", "u32", "u32"]

# Tell the runtime where each overlay (actors, effects, game states, pause menu) is loaded, by VROM.
# Overlay_Load(vromStart, vromEnd, vramStart, vramEnd, allocatedRamAddr)
[[patches.func]]
name = "sot_on_overlay_load"
args = ["u32", "u32", "u32"]

[[patches.func]]
name = "sot_on_game_fault"
args = ["u32", "u32"]

[[patches.hook]]
func = "Overlay_Load"
text = "    load_overlays((uint32_t)ctx->r4, MEM_W(0x10, ctx->r29), (uint32_t)(ctx->r5 - ctx->r4)); sot_on_overlay_load((uint32_t)ctx->r4, MEM_W(0x10, ctx->r29), (uint32_t)(ctx->r5 - ctx->r4));"

# The game's error handler (it would show its crash screen and hang): write a crash log instead
[[patches.hook]]
func = "Fault_AddHungupAndCrashImpl"
text = "    sot_on_game_fault((uint32_t)ctx->r4, (uint32_t)ctx->r5);"

# Single-instruction patches

# Sands of Time's Graph_TaskSet00 (uLib) arms a 3 second timer with an OSTimer on the stack to detect an RCP hang,
# and stops it when the graphics task is done. The runtime's timer thread keeps reading timers from memory, so stack
# timers can be left behind with garbage contents and later send a message to a garbage queue (random crashes in
# osSendMesg). The RCP can't hang here: don't arm the timer.
[[patches.instruction]]
func = "func_8070DD64"
vram = 0x8070DE08 # jal osSetTimer
value = 0x00000000

[[patches.instruction]]
func = "func_8070DD64"
vram = 0x8070DE20 # jal osStopTimer
value = 0x00000000
